name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run gate regression (wf-lint / card-lint / done-gate)
        run: bash tests/run-gates.sh
